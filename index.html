<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d1a" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Minh & Thủy — 24.12.2026. Cùng chơi và nhận thiệp cưới!" />
    <meta property="og:title" content="Minh & Thủy · 24.12.2026" />
    <meta property="og:description" content="Thiệp mời cưới — cuộn để chơi cùng cô dâu chú rể!" />
    <title>Minh &amp; Thủy · 24.12.2026</title>
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <div id="game-root"></div>

        <button id="info-btn" type="button" class="hud-btn" aria-label="Xem thông tin thiệp cưới" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
            <rect x="1" y="3" width="14" height="10" />
            <rect class="cut" x="3" y="5" width="10" height="6" />
            <rect x="3" y="5" width="2" height="1" /><rect x="5" y="6" width="2" height="1" />
            <rect x="7" y="7" width="2" height="1" /><rect x="9" y="6" width="2" height="1" />
            <rect x="11" y="5" width="2" height="1" />
          </svg>
          <span>THIỆP</span>
        </button>

        <button id="music-toggle" type="button" aria-label="Tắt nhạc" aria-pressed="true" hidden>
          <!-- 16×16 pixel-art double note; the "off" state adds a slash. -->
          <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
            <g class="note">
              <rect x="5" y="3" width="8" height="2" />
              <rect x="5" y="5" width="1" height="6" />
              <rect x="12" y="5" width="1" height="5" />
              <rect x="2" y="10" width="4" height="3" />
              <rect x="1" y="11" width="1" height="1" />
              <rect x="9" y="9" width="4" height="3" />
              <rect x="8" y="10" width="1" height="1" />
            </g>
            <g class="slash">
              <rect x="1" y="1" width="2" height="2" />
              <rect x="3" y="3" width="2" height="2" />
              <rect x="5" y="5" width="2" height="2" />
              <rect x="7" y="7" width="2" height="2" />
              <rect x="9" y="9" width="2" height="2" />
              <rect x="11" y="11" width="2" height="2" />
              <rect x="13" y="13" width="2" height="2" />
            </g>
          </svg>
        </button>

        <!-- Scroll-to-play: this transparent layer scrolls; the level follows it. -->
        <div id="scroller" class="is-locked" tabindex="0" aria-label="Cuộn để chơi">
          <div id="scroll-spacer"></div>
        </div>

        <!-- Essential wedding information at the Seasons venue (filled from event.vi.js). -->
        <section id="venue-card" class="info-card" aria-label="Thông tin tiệc cưới" hidden></section>

        <div id="rsvp" role="dialog" aria-modal="false" aria-labelledby="rsvp-q" hidden>
          <span class="dlg-tag" aria-hidden="true">♥ RSVP</span>
          <p class="dlg-text" id="rsvp-q" aria-live="polite"></p>
          <label class="dlg-name" hidden>
            <span>TÊN CỦA BẠN</span>
            <input id="rsvp-name" class="dlg-input" type="text" maxlength="40" autocomplete="name" enterkeyhint="done" />
          </label>
          <div class="dlg-choices">
            <button type="button" class="dlg-choice is-yes" data-answer="yes">CÓ, MÌNH SẼ ĐẾN!</button>
            <button type="button" class="dlg-choice is-no" data-answer="no">TIẾC QUÁ, MÌNH KHÔNG ĐẾN ĐƯỢC</button>
          </div>
        </div>

        <!-- Screen navigation fallback (swipe / wheel / keys do the same). -->
        <nav id="screen-nav" aria-label="Chuyển màn" hidden>
          <button type="button" class="sn-btn sn-prev" aria-label="Màn trước">▲</button>
          <div class="sn-dots"></div>
          <button type="button" class="sn-btn sn-next" aria-label="Màn tiếp theo">▼</button>
        </nav>

        <div id="end-actions" hidden>
          <p class="end-msg" hidden></p>
          <button type="button" class="px-btn" id="btn-gallery">📷 XEM KHOẢNH KHẮC</button>
          <div class="end-row">
            <button type="button" class="px-btn ghost" id="btn-review">▲ XEM LẠI THIỆP</button>
            <button type="button" class="px-btn ghost" id="btn-replay">↺ CHƠI LẠI</button>
          </div>
          <button type="button" class="link-btn" id="btn-change">ĐỔI CÂU TRẢ LỜI</button>
        </div>

        <div id="photo-modal" class="px-modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" hidden>
          <div class="pm-box">
            <p class="pm-title" id="pm-title">ĐÃ TÌM THẤY!</p>
            <p class="pm-sub">KHOẢNH KHẮC #01</p>
            <div class="pm-frame">
              <img alt="" decoding="async" hidden />
              <div class="pm-missing" hidden>
                <span class="pm-cam" aria-hidden="true">📷</span>
                <span>Ảnh sẽ được cập nhật sớm!</span>
              </div>
            </div>
            <button type="button" class="px-btn pm-close">ĐÓNG</button>
          </div>
        </div>

        <div id="gallery" class="px-modal" role="dialog" aria-modal="true" aria-labelledby="gl-title" hidden>
          <div class="pm-box">
            <p class="pm-title" id="gl-title">KHOẢNH KHẮC</p>
            <p class="pm-sub gl-count">ẢNH ĐÃ TÌM: 0/3</p>
            <div class="gl-grid"></div>
            <p class="gl-note"></p>
            <button type="button" class="px-btn gl-close">ĐÓNG</button>
          </div>
        </div>
        <!-- Quick invitation view: all essentials + RSVP without playing. -->
        <div id="info-modal" class="px-modal" role="dialog" aria-modal="true" aria-labelledby="qv-title" hidden>
          <div class="pm-box qv-box">
            <div class="info-card qv-card"></div>
            <section class="qv-rsvp" aria-labelledby="qv-q" hidden>
              <p class="dlg-text" id="qv-q" aria-live="polite"></p>
              <label class="dlg-name" hidden>
                <span>TÊN CỦA BẠN</span>
                <input class="dlg-input" type="text" maxlength="40" autocomplete="name" enterkeyhint="done" />
              </label>
              <div class="dlg-choices">
                <button type="button" class="dlg-choice is-yes" data-answer="yes"></button>
                <button type="button" class="dlg-choice is-no" data-answer="no"></button>
              </div>
            </section>
            <div class="qv-done" hidden>
              <p class="qv-done-text" role="status"></p>
              <button type="button" class="link-btn qv-change">ĐỔI CÂU TRẢ LỜI</button>
            </div>
            <div class="qv-actions">
              <button type="button" class="px-btn qv-play">▶ VÀO GAME</button>
              <button type="button" class="link-btn qv-photos">📷 KHOẢNH KHẮC BÍ MẬT</button>
            </div>
          </div>
        </div>

        <div id="boot-loader" role="status" aria-live="polite">
          <div class="ld-title">MINH &amp; THỦY</div>
          <div class="ld-label">LOADING...</div>
          <div class="ld-bar" role="progressbar" aria-label="Đang tải" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="ld-fill"></span></div>
        </div>

        <!-- Title screen UI, placed inside the pixel title world (positions set by TitleIntro). -->
        <div id="title-ui" hidden>
          <p id="title-q" class="title-q"></p>
          <button type="button" id="start-btn" class="px-btn title-start">▶ BẮT ĐẦU</button>
          <button type="button" id="quick-btn" class="title-quick">XEM THÔNG TIN THIỆP</button>
        </div>
        <button type="button" id="skip-btn" class="skip-btn" hidden>BỎ QUA ▸▸</button>

        <div id="rotate-hint" hidden>
          <p>Hãy xoay dọc điện thoại để có trải nghiệm đẹp nhất.</p>
        </div>

        <noscript><p class="noscript">Vui lòng bật JavaScript để mở thiệp.</p></noscript>
      </div>
    </div>
    <div id="safe-probe" aria-hidden="true"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
